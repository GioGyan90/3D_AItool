name: Stage 5 C ear and face calibration training
on:
  push:
    branches: ['training/stage5-c-ears']
permissions:
  contents: read
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: node --import tsx --test tests/regionInset.test.ts
      - run: npm install --no-save --no-package-lock playwright
      - run: sudo apt-get update -qq && sudo apt-get install -y fonts-noto-cjk
      - run: node training/stage5-c-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage5-c-training
          path: artifacts/stage5-c/
