name: Shape3D topology validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/topology-visual-qa.mjs'
      - 'scripts/topology-edge-lock-qa.mjs'
      - '.github/workflows/topology-ci.yml'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/topology-visual-qa.mjs'
      - 'scripts/topology-edge-lock-qa.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - '.github/workflows/topology-ci.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  topology:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate TypeScript
        run: npm run lint
      - name: Test edge-loop topology
        run: npm run test:topology
      - name: Build public studio
        run: npm run build:pages
      - name: Install CJK fonts for accurate Chinese UI screenshots
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          fc-cache -f
      - name: Set up Playwright against runner's preinstalled Google Chrome
        run: npm install --no-save --no-package-lock playwright
      - name: Capture and inspect topology in actual WebGL canvas
        run: node scripts/topology-visual-qa.mjs
      - name: Accept edge sliding and region locking in real WebGL UI
        run: node scripts/topology-edge-lock-qa.mjs
      - name: Upload edge-slide and region-lock acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shape3d-edge-lock-browser-qa
          path: artifacts/topology-edge-lock/
          retention-days: 14
      - name: Upload multi-angle topology screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shape3d-topology-screenshots
          path: artifacts/topology-qa/
          retention-days: 14
      - name: Attach generated site for review
        uses: actions/upload-artifact@v4
        with:
          name: shape3d-studio-dist
          path: docs/studio/
          retention-days: 7
      - name: Commit refreshed static studio
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs/studio
          if ! git diff --cached --quiet; then
            git commit -m "build: refresh Shape3D Studio Pages assets"
            git push origin HEAD:main
          fi
