name: Stage 5K constrained transition calibration
on:
  push:
    branches: [training/stage5-k-constrained-refinement]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run lint
      - run: npm run test:topology
      - run: npm install --no-save --no-package-lock playwright
      - run: sudo apt-get update -qq && sudo apt-get install -y fonts-noto-cjk
      - run: gh run download 45847010497 -n stage5-j-constrained-transition -D stage5-j-artifact
        env:
          GH_TOKEN: ${{ github.token }}
      - run: node --import tsx training/stage5-k-constrained-refinement.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage5-k-constrained-refinement
          path: artifacts/stage5-k
