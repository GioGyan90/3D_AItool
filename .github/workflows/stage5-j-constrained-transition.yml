name: Stage 5J constrained transition calibration
on:
  push:
    branches: [training/stage5-j-constrained-transition]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run lint
      - run: npm run test:topology
      - run: npm install --no-save --no-package-lock playwright
      - run: sudo apt-get update -qq && sudo apt-get install -y fonts-noto-cjk
      - run: gh run download 45814451271 -n stage5-h-orbit-calibration -D stage5-h-artifact
        env:
          GH_TOKEN: ${{ github.token }}
      - run: node --import tsx training/stage5-j-constrained-transition.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage5-j-constrained-transition
          path: artifacts/stage5-j
