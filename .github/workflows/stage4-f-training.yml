name: Stage 4 F reference training
on:
  push:
    branches: ['training/stage4-f-reference']
permissions:
  contents: read
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm install --no-save --no-package-lock playwright
      - run: sudo apt-get update -qq && sudo apt-get install -y fonts-noto-cjk
      - run: node training/stage4-f-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage4-f-training
          path: artifacts/stage4-f-training/
